name: sentinel-stream

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: sentinel-stream-backend:latest
  environment: &backend-env
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
    PYTHONUNBUFFERED: "1"
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The ONNX model (backend/model.onnx) is trained automatically during the
  # image build (see backend/Dockerfile), so every service below starts with a
  # ready-to-serve model.
  api:
    <<: *backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["python", "-u", "worker.py"]
    environment:
      <<: *backend-env
      MODEL_PATH: model.onnx

  simulator:
    <<: *backend
    command: ["python", "-u", "simulator.py"]
    environment:
      <<: *backend-env
      NORMAL_RATE_TPS: "15"
      BURST_RATE_TPS: "60"

volumes:
  pgdata:
